- id: "laboratory"
  number: "01"
  title: "Clinical Laboratory Operations"
  short: "Laboratory"
  colour: "#22D3EE"
  remit: "Diagnostic service leadership grounded in analytical accuracy, quality control and clinically useful reporting."
  methods:
    - "Clinical chemistry"
    - "Haematology"
    - "Microbiology"
    - "Immunology"
  evidence: "Principal Biomedical Scientist leadership, diagnostic validation, internal quality control, external quality assurance and instrument lifecycle oversight."
  output: "Reliable laboratory services, auditable workflows and results that support safe clinical decisions."
- id: "epidemiology"
  number: "02"
  title: "Public Health and Epidemiology"
  short: "Epidemiology"
  colour: "#34D399"
  remit: "Population-health reasoning across prevention, surveillance, screening, outbreak intelligence and service access."
  methods:
    - "Disease surveillance"
    - "Screening programmes"
    - "Health systems"
    - "Health equity"
  evidence: "Public-health postgraduate training, community outreach, infectious-disease research and district-level assessment of structural determinants."
  output: "Evidence that supports prioritisation, targeted outreach and practical public-health response."
- id: "spatial"
  number: "03"
  title: "Spatial Epidemiology and GIS"
  short: "Spatial GIS"
  colour: "#A78BFA"
  remit: "Geographic analysis of disease burden, service access and structural inequity across Ghanaian regions and districts."
  methods:
    - "Moran's I"
    - "LISA"
    - "Choropleth mapping"
    - "GeoJSON"
  evidence: "Reproducible district pipelines, true-coordinate field mapping, regional summaries and spatial-cluster interpretation."
  output: "Maps and local statistics that reveal where burden, access and vulnerability concentrate."
- id: "data"
  number: "04"
  title: "Clinical Data Science and Modelling"
  short: "Data Science"
  colour: "#FBBF24"
  remit: "Applied analysis that turns clinical and public-health data into reproducible models, interfaces and decision records."
  methods:
    - "Python and R"
    - "Machine learning"
    - "SHAP"
    - "Dashboard engineering"
  evidence: "HIV/AIDS forecasting work, research repositories, model files, interactive dashboards and documented analytical pipelines."
  output: "Transparent analytical artefacts that make methods, assumptions and findings inspectable."
- id: "governance"
  number: "05"
  title: "Quality Systems and Scientific Leadership"
  short: "Governance"
  colour: "#F87171"
  remit: "Governance linking people, methods, documentation, equipment and data quality across laboratory and research workflows."
  methods:
    - "ISO 15189"
    - "SOP governance"
    - "Biosafety"
    - "Audit readiness"
  evidence: "Team leadership, quality documentation, equipment management, staff development and reproducibility standards."
