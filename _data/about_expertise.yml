- id: "epidemiology"
  number: "02"
  title: "Public Health and Epidemiology"
  short: "Epidemiology"
  colour: "#34D399"
  remit: "Population health practice spanning prevention, surveillance, screening, outbreak assessment and access to services."
  methods:
    - "Disease surveillance"
    - "Screening programmes"
    - "Health systems"
