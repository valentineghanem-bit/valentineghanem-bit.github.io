- id: "laboratory"
  number: "01"
  title: "Clinical Laboratory Operations"
  short: "Laboratory"
  colour: "#22D3EE"
  remit: "Leadership of diagnostic services with an emphasis on analytical accuracy, quality control and clinically interpretable reporting."
  methods:
    - "Clinical chemistry"
    - "Haematology"
    - "Microbiology"
