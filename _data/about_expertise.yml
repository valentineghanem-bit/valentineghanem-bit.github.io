  evidence: "Postgraduate training in public health, community outreach, infectious-disease research and district-level assessment of structural determinants."
  output: "Evidence for priority setting, targeted outreach and proportionate public health response."
- id: "spatial"
  number: "03"
  title: "Spatial Epidemiology and GIS"
  short: "Spatial GIS"
  colour: "#A78BFA"
  remit: "Geographic analysis of disease burden, service access and structural inequity across Ghana's regions and districts."
  methods:
    - "Moran's I"
    - "LISA"
    - "Choropleth mapping"
    - "GeoJSON"
  evidence: "Reproducible district-level pipelines, coordinate-based field mapping, regional summaries and interpretation of spatial clusters."
