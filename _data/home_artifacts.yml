- id: "anc-fertility"
  title: "Antenatal Care and Fertility Inequities"
  domain: "Maternal health"
  status: "Preprint and reproducible analysis"
  icon: "fa-person-pregnant"
  summary: "Longitudinal spatial analysis of skilled antenatal-care coverage and fertility inequities across nine Ghana survey waves from 1988 to 2022."
  evidence: "The repository combines spatial autocorrelation, LISA, mixed-effects models, Random Forest and a Care Efficiency Index across Ghana's 16 regions."
  methods:
    - "Spatial ML"
    - "LISA"
    - "Mixed effects"
    - "Python and R"
  repo_url: "https://github.com/valentineghanem-bit/anc-fertility-ghana-inequities"
  demo_url: "https://htmlpreview.github.io/?https://github.com/valentineghanem-bit/anc-fertility-ghana-inequities/blob/main/dashboard/ANC_Fertility_Dashboard_Ghana.html"
  release_url: "https://doi.org/10.5281/zenodo.21340350"

- id: "hiv-tb"
  title: "HIV-TB Co-infection Risk Mapping"
  domain: "Spatial epidemiology"
  status: "Analysis and model repository"
  icon: "fa-virus"
  summary: "District-level analysis of HIV-TB co-infection using spatial statistics, geographically weighted regression and ensemble machine learning."
  evidence: "The pipeline covers all 261 districts and reports both conventional and leave-one-region-out spatial validation so generalisation limits remain visible."
  methods:
    - "Moran's I"
    - "GWR"
    - "LightGBM"
    - "Spatial CV"
  repo_url: "https://github.com/valentineghanem-bit/hiv-tb-ml-ghana-261districts"
  demo_url: "https://htmlpreview.github.io/?https://github.com/valentineghanem-bit/hiv-tb-ml-ghana-261districts/blob/main/dashboard/HIV_TB_Ghana_Dashboard.html"
  release_url: "https://doi.org/10.5281/zenodo.21351614"

- id: "ntd-wash"
  title: "NTD, WASH and Poverty Nexus"
  domain: "Health equity"
  status: "Reproducible spatial study"
  icon: "fa-droplet"
  summary: "Maps the structural conditions associated with neglected tropical-disease receptivity across Ghana's 261 districts."
  evidence: "The workflow joins district poverty, literacy and insurance data with regional WASH indicators and WHO NTD context, while clearly separating receptivity from observed incidence."
  methods:
    - "PCA index"
    - "LISA"
    - "Spatial CV"
    - "Calibration"
  repo_url: "https://github.com/valentineghanem-bit/ntd-wash-poverty-nexus-ghana"
  demo_url: "https://htmlpreview.github.io/?https://github.com/valentineghanem-bit/ntd-wash-poverty-nexus-ghana/blob/main/dashboard/NTD_WASH_Poverty_Ghana_Dashboard.html"

- id: "burden-forecasting"
  title: "Ghana Disease Burden Forecasting"
  domain: "Forecasting"
  status: "Analysis complete"
  icon: "fa-chart-line"
  summary: "A source-provenance and forecasting workflow for short national health-indicator panels assembled from WHO and World Bank data."
  evidence: "The project audits six data-integrity pitfalls, assembles 25 indicators and compares per-series classical models with LSTM under walk-forward validation."
  methods:
    - "ARIMA"
    - "ETS"
    - "LSTM"
    - "Walk-forward CV"
  repo_url: "https://github.com/valentineghanem-bit/disease-burden-forecasting-ghana"
  demo_url: "https://htmlpreview.github.io/?https://github.com/valentineghanem-bit/disease-burden-forecasting-ghana/blob/main/dashboard/Ghana_BurdenForecasting2030_Dashboard.html"

- id: "hiv-spatial"
  title: "HIV Spatial Epidemiology in Ghana"
  domain: "Spatial epidemiology"
  status: "Manuscript analysis repository"
  icon: "fa-map-location-dot"
  summary: "Examines Ghana's regional HIV pattern through spatial dependence models, hotspot analysis and explainable machine-learning sensitivity checks."
  evidence: "The repository explicitly distinguishes regional DHS estimates from district communication geometry, avoiding false district-level precision."
  methods:
    - "Spatial error"
    - "LISA"
    - "GWR"
    - "SHAP"
  repo_url: "https://github.com/valentineghanem-bit/hiv-spatial-epidemiology-ghana"
  demo_url: "https://htmlpreview.github.io/?https://github.com/valentineghanem-bit/hiv-spatial-epidemiology-ghana/blob/main/dashboard/HIV_Spatial_Ghana_Dashboard.html"
  release_url: "https://doi.org/10.5281/zenodo.21341247"

- id: "immunisation"
  title: "Subnational Immunisation Coverage Gaps"
  domain: "Health systems"
  status: "Reproducible district analysis"
  icon: "fa-syringe"
  summary: "Links regional immunisation coverage with district socioeconomic conditions to examine equity gaps across all 261 Ghanaian districts."
  evidence: "The analysis builds an Immunisation District Risk Index and compares logistic regression with Random Forest and XGBoost under leave-one-region-out validation."
  methods:
    - "Risk index"
    - "LISA"
    - "Logistic regression"
    - "Spatial CV"
  repo_url: "https://github.com/valentineghanem-bit/ghana-immunisation-coverage-261-districts"
  demo_url: "https://htmlpreview.github.io/?https://github.com/valentineghanem-bit/ghana-immunisation-coverage-261-districts/blob/main/dashboard/HI-EI_Dashboard.html"
