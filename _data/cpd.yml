- year: "2023"
  entries:
    - title: "Renal and Public Health Laboratory Practices"
      brief: "A multidisciplinary webinar covering renal physiology and biomarkers, viral-haemorrhagic-fever case management, IDSR, personal protective equipment, safe needle handling and customer service in laboratory practice."
      topics: "The kidney and its disorders; fluid and electrolyte balance; renal biomarkers (Cystatin C, NGAL, Procalcitonin and sdLDL); case management of viral haemorrhagic fevers in Ghana; needle manipulation; IDSR and the role of the laboratory; use of personal protective equipment; customer service."
      provider: "GAMLS Greater Accra Region (Zoom webinar, 3-10 May 2023)"
      issuing_body: "Ghana Association of Medical Laboratory Scientists, Greater Accra Region"
      delivery_mode: "Online"
      certificate_url: "/assets/files/cpd/2023-renal-public-health.pdf"
    - title: "Laboratory Diagnosis of Adrenal Disease, AMR, Waste Management, Lead Testing"
      brief: "A webinar series covering adrenal-disease diagnosis, antimicrobial resistance, healthcare-waste management and laboratory lead testing."
      topics: "Laboratory diagnosis of adrenal disease; antimicrobial resistance; healthcare-waste management; laboratory lead testing."
