- year: "2026"
  entries:
    - title: "CPD Certificate (Categories A, B & C)"
      brief: "A 23-point, three-category online programme covering fungal diagnostics, high-vaginal-swab culture, blood-film interpretation, thalassaemia, quality-management implementation, professional presentation and procurement planning."
      topics: "Fungal identification and antifungal susceptibility testing; culture of a high vaginal swab; practical blood-film comments; thalassaemia in low-resource settings; process approach to management-system implementation; effective professional PowerPoint presentations; procurement planning."
      provider: "GAMLS Greater Accra (Zoom, 27 April-5 May 2026)"
      issuing_body: "Ghana Association of Medical Laboratory Scientists, Greater Accra Region"
      delivery_mode: "Online"
      certificate_url: "/assets/files/cpd/2026-gamls-greater-accra-categories-abc.pdf"
      external_url: "https://drive.google.com/file/d/1B5fs2--BfOnZxI5KGo9v0b_Bt7ZeS9o6/view?usp=sharing"
- year: "2025"
  entries:
    - title: "CPD Certificate (Categories A, B & C)"
      brief: "A 20-point, three-category online programme spanning clinical microbiology, specimen quality, antimicrobial testing, professional wellbeing, healthcare-waste policy, cholera management and the contribution of Allied Health Professionals in Ghana."
      topics: "The role of microbiology in clinical care; proper specimen collection for microbiology analysis; beyond antibiotic sensitivity testing; balancing life and career as an Allied Health Professional; legislative, regulatory and policy aspects of healthcare waste; cholera management; the role of Allied Health Professionals in Ghana."
      provider: "GAMLS Greater Accra (Zoom, 28 July-2 August 2025)"
      issuing_body: "Ghana Association of Medical Laboratory Scientists, Greater Accra Region"
      delivery_mode: "Online"
      certificate_url: "/assets/files/cpd/2025-gamls-greater-accra-categories-abc.pdf"
      external_url: "https://drive.google.com/file/d/1GTk25SaYeP92STFS6egPH1JEJJm4cltv/view?usp=sharing"
