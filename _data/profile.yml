description: >
  Valentine Golden Ghanem is a Ghanaian medical scientist, epidemiologist and public
  health researcher with over a decade of experience in diagnostic medicine and
  data-informed health systems. He is Principal Biomedical Scientist at Cocoa Clinic,
  Ghana Cocoa Board. His work combines laboratory medicine, epidemiology,
  clinical data science, spatial analysis and machine learning to strengthen disease
  surveillance and reduce health inequities.
