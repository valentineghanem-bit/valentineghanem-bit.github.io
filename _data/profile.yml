statement_of_purpose: >
  My work connects diagnostic medicine with public health practice. I interpret
  laboratory, clinical and field evidence to inform surveillance, service planning
  and timely response, while preserving the clinical context of each analytical
  decision.
career_vision: >
  I aim to lead interdisciplinary programmes that bring biomedical science,
  epidemiology, data science and health policy into public health decision-making.
  My focus is stronger disease surveillance and fairer access to care in African
  health systems, especially where resources and routine data are limited.
aim: >
  To connect diagnostic evidence with public health action through reproducible
  analysis, digital tools and decision systems designed for African
  health settings.
objectives:
  - "Translate laboratory evidence into timely, interpretable information for public health surveillance."
  - "Design and evaluate digital health and predictive tools for epidemic detection and response in resource-constrained settings."
  - "Work with policymakers and health-sector stakeholders to incorporate biomedical data science into national and regional policy."
  - "Develop targeted interventions that address structural health inequities across African populations."
  - "Connect frontline clinical practice with rigorous, system-level public health research."
