- category: "Technical"
  groups:
    - name: "Public Health"
      icon: "🌍"
      items:
        - "Disease surveillance and case documentation — laboratory records and CPD training related to epidemic response, including viral haemorrhagic fevers, malaria and HIV/AIDS."
        - "Community screening and diagnostics — point-of-care assessment using HemoCue, urinalysis dipsticks and glucose meters in rural settings."
        - "Public health interpretation — incorporation of diagnostic evidence into surveillance reports and technical presentations."
    - name: "Data Science"
      icon: "💻"
      items:
        - "Python (Pandas, Scikit-learn, Matplotlib) for disease modelling and HIV incidence forecasting."
        - "R (ARIMA, GLMs) for time-series prediction and epidemiological graphing."
        - "Tableau and Streamlit for interactive dashboards and analytical reporting."
        - "Machine learning: XGBoost, Ridge Regression, SHAP for model interpretation."
        - "Google Colab, Jupyter & GitHub for reproducible, version-controlled workflows."
        - "ArcGIS & Folium for spatial epidemiology and choropleth mapping."
    - name: "Biomedical Science"
      icon: "🧪"
      items:
        - "Cross-disciplinary specimen workflow: request review, patient and specimen identification, collection requirements, accessioning, centrifugation, aliquoting, transport, storage, rejection criteria and traceable documentation."
        - "Clinical chemistry: Mindray BS600 operation across photometric end-point, fixed-time and kinetic assays, with calibration, reagent and quality-control review, reaction flags, reruns and dilution workflows."
        - "Clinical haematology: Sysmex XN550 full blood count and differential workflows, histogram, scattergram and flag review, reruns, peripheral blood-film preparation, staining and morphology correlation."
        - "Immunoassay and serology: Roche cobas e411 electrochemiluminescence workflows for qualitative and quantitative immunochemistry, with calibrator and control acceptance, antigen-antibody principles and screening or confirmatory logic."
        - "Clinical microscopy: bright-field setup and care, slide preparation, fixation and staining, and urine-sediment, blood-film, parasite, wet-mount and Gram-stain examination with morphology-based interpretation."
        - "Bacteriology and antimicrobial susceptibility testing: primary specimen assessment, culture and isolation, colony morphology, Gram reaction, VITEK 2 identification and susceptibility testing, BACTEC blood-culture detection and resistance-pattern review."
        - "Molecular diagnostics: GeneXpert and real-time PCR workflows, controls, contamination prevention, amplification review and post-run data verification."
        - "Histopathology and immunohistochemistry: fixation and tissue-processing principles, Leica RM2235 microtomy, Leica TP1020 processing, H&E orientation and basic immunohistochemistry."
        - "Point-of-care and routine bench testing: HemoCue, glucose meters, urine dipsticks and medical-mission screening, with operator quality control, patient identification and result documentation."
        - "Cross-disciplinary foundations: immunology, transfusion science, coagulation, body-fluid analysis and pathology principles acquired through degree rotations and continuing professional development, distinguished from current platform-specific practice."
- category: "Analytical"
  groups:
    - name: "Public Health"
      icon: "🌍"
      items:
        - "Monitoring and evaluation — health programme indicators, risk assessment and occupational-hazard review informed by CPD training."
        - "Outbreak data management — compilation of laboratory data for COVID-19 and viral-haemorrhagic-fever surveillance."
        - "Scientific reporting — CPD summaries, internal laboratory reports and analytical presentations."
    - name: "Data Science"
      icon: "💻"
      items:
        - "Model interpretability (SHAP) for HIV incidence prediction models."
        - "Epidemiological forecasting — ARIMA and ensemble models (XGBoost) on HIV/AIDS incidence data."
        - "Model validation & tuning — 5-fold cross-validation and grid search."
    - name: "Biomedical Science"
      icon: "🧪"
      items:
        - "Cross-disciplinary result validation: review of pre-examination integrity, calibration and control status, analyser flags, reference intervals, plausibility, critical values and clinical or morphological correlation before release."
        - "Microscopy interpretation: systematic field examination, formed-element or organism recognition, morphology correlation, artefact discrimination, semi-quantitative reporting and escalation of uncertain findings."
        - "Quality assurance: internal quality control, Westgard-rule interpretation, external quality assessment through RIQAS, NEQAS and Sysmex Caresphere, trend review and investigation of unacceptable performance."
        - "Method and instrument verification: precision, comparability, reportable-range, calibration and maintenance review before routine use or after significant change."
        - "Clinical data verification through the Cocoa Clinic Data Validation Committee, including consistency review, traceability and reconciliation of laboratory information."
        - "SOP, nonconformity and compliance review under SLIPTA and SLMTA principles toward ISO 15189 alignment, including corrective and preventive action."
- category: "Leadership"
  groups:
    - name: "Public Health"
      icon: "🌍"
      items:
        - "Coordination of laboratory operations during Cocoa Clinic medical missions."
        - "Health communication — patient education and explanation of laboratory results during outreach activities."
        - "Public health interpretation of laboratory findings for surveillance and service planning."
    - name: "Data Science"
      icon: "💻"
      items:
        - "Application of machine-learning models to observed epidemiological trends."
        - "Leading dashboard development with Streamlit and Tableau for academic and public health audiences."
    - name: "Biomedical Science"
      icon: "🧪"
      items:
        - "Cross-disciplinary laboratory coordination across chemistry, haematology, immunoassay, microscopy, microbiology, molecular diagnostics and point-of-care services."
        - "Team development and competency support across pre-examination, examination and post-examination procedures, including induction, direct observation, quality-control review and supervised result validation."
        - "Quality-system leadership: SOP governance, audit readiness, nonconformity review, corrective action, risk control and continual improvement aligned with ISO 15189 principles."
        - "Equipment lifecycle and inventory management for BS600, XN550, cobas e411 and associated laboratory systems, including maintenance planning, reagent availability and service escalation."
        - "Biosafety and infection-prevention oversight covering risk assessment, personal protective equipment, waste segregation, exposure response and safe handling of clinical material."
        - "Referral and specialist-testing governance: specimen suitability, stability, packaging, chain of custody, reference-laboratory communication and reconciliation of returned results."
